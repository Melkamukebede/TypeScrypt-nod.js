</pattern>
<rect width="1200" height="1200" fill="url(#dots)"/>

<!-- Connector lines from center to phase hubs -->
<!-- P1 top-left -->
<line x1="600" y1="600" x2="280" y2="260" stroke="#534AB7" stroke-width="1.5" opacity="0.4"/>
<!-- P2 top-right -->
<line x1="600" y1="600" x2="920" y2="260" stroke="#0F6E56" stroke-width="1.5" opacity="0.4"/>
<!-- P3 bottom-right -->
<line x1="600" y1="600" x2="920" y2="940" stroke="#854F0B" stroke-width="1.5" opacity="0.4"/>
<!-- P4 bottom-left -->
<line x1="600" y1="600" x2="280" y2="940" stroke="#993C1D" stroke-width="1.5" opacity="0.4"/>

<!-- Connector lines from phase hubs to leaf nodes -->

<!-- P1 → Node.js -->
<line x1="280" y1="260" x2="100" y2="130" stroke="#534AB7" stroke-width="1" opacity="0.3"/>
