<line x1="920" y1="260" x2="1110" y2="180" stroke="#0F6E56" stroke-width="1" opacity="0.3"/>
<!-- P2 → HTTP codes -->
<line x1="920" y1="260" x2="1110" y2="320" stroke="#0F6E56" stroke-width="1" opacity="0.3"/>

<!-- P3 → SQL -->
<line x1="920" y1="940" x2="1100" y2="820" stroke="#854F0B" stroke-width="1" opacity="0.3"/>
