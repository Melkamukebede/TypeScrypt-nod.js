<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">

<rect width="1200" height="1200" fill="#0d1117"/>

<!-- Subtle grid dots -->
