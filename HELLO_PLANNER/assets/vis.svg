<!-- ═══════════════════════════════════════ -->
<!-- PHASE 2 HUB — top-right — teal -->
<!-- ═══════════════════════════════════════ -->
<circle cx="920" cy="260" r="52" fill="#0d1f1a" stroke="#0F6E56" stroke-width="1.5"/>
